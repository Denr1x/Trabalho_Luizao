name: Testes da Lanterna

on:
  pull_request:
    paths:
      - 'Trabalho_do_Luizao/Assets/Scripts/**'
      - 'Trabalho_do_Luizao/Assets/Tests/**'
      - 'Trabalho_do_Luizao/Packages/**'
      - 'Trabalho_do_Luizao/ProjectSettings/**'
      - '.github/workflows/lanterna-tests.yml'

  push:
    branches:
      - main
    paths:
      - 'Trabalho_do_Luizao/Assets/Scripts/**'
      - 'Trabalho_do_Luizao/Assets/Tests/**'
      - 'Trabalho_do_Luizao/Packages/**'
      - 'Trabalho_do_Luizao/ProjectSettings/**'
      - '.github/workflows/lanterna-tests.yml'

  workflow_dispatch:

jobs:
  testes:
    name: Testes EditMode
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restaurar cache da Unity
        uses: actions/cache@v4
        with:
          path: Trabalho_do_Luizao/Library
          key: Library-${{ runner.os }}-${{ hashFiles('Trabalho_do_Luizao/Assets/**', 'Trabalho_do_Luizao/Packages/**', 'Trabalho_do_Luizao/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Executar testes da Unity
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: Trabalho_do_Luizao
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
