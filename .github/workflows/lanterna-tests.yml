name: Testes da Lanterna

on:
  pull_request:
    paths:
      - 'Trabalho_do_Luizao/Assets/Scripts/**'
      - 'Trabalho_do_Luizao/Assets/Tests/**'
      - 'Trabalho_do_Luizao/Packages/**'
      - 'Trabalho_do_Luizao/ProjectSettings/**'
      - '.github/workflows/lanterna-tests.yml'

  push:
    branches:
      - main
    paths:
      - 'Trabalho_do_Luizao/Assets/Scripts/**'
      - 'Trabalho_do_Luizao/Assets/Tests/**'
      - 'Trabalho_do_Luizao/Packages/**'
      - 'Trabalho_do_Luizao/ProjectSettings/**'
      - '.github/workflows/lanterna-tests.yml'

  workflow_dispatch:

jobs:
  testes:
    name: Testes EditMode
    runs-on: ubuntu-latest

    steps:
      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Executar testes da Unity
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Trabalho_do_Luizao
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
